<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Manrope',sans-serif}
  a.au-link{text-decoration:none}
  input{box-sizing:border-box}
</style>
</helmet>

<div data-screen-label="Checkout" style="background-color:#fff9f3;background-repeat:repeat-y;background-size:100% 950px;background-image:
    radial-gradient(700px circle at 8% 8%, rgba(165,209,228,.4), transparent 60%),
    radial-gradient(650px circle at 92% 20%, rgba(191,181,232,.35), transparent 58%);color:#3a352e;min-height:100vh">

  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 64px;border-bottom:1px solid rgba(58,53,46,.12)">
    <a href="Home.dc.html" style="display:flex;align-items:center"><img src="assets/aurealis-logo-black.webp" alt="Auréalis" style="height:56px;width:auto;display:block"></a>
    <div style="font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6b6357">Secure Checkout</div>
  </div>

  <div style="padding:56px 64px 100px;display:grid;grid-template-columns:1.5fr 1fr;gap:70px">

    <div>
      <div style="margin-bottom:40px">
        <div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#c1602f;font-weight:700;margin-bottom:12px">Contact</div>
        <input type="email" placeholder="Email address" style="width:100%;padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
      </div>

      <div style="margin-bottom:40px">
        <div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#c1602f;font-weight:700;margin-bottom:12px">Shipping Address</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px">
          <input type="text" placeholder="First name" style="padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
          <input type="text" placeholder="Last name" style="padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
        </div>
        <input type="text" placeholder="Address" style="width:100%;padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff;margin-bottom:14px">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px">
          <input type="text" placeholder="City" style="padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
          <input type="text" placeholder="Postal code" style="padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
          <input type="text" placeholder="Country" style="padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
        </div>
      </div>

      <div style="margin-bottom:40px">
        <div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#c1602f;font-weight:700;margin-bottom:12px">Shipping Method</div>
        <div style="display:flex;flex-direction:column;gap:10px">
          <label style="display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:10px;border:1.5px solid #3a352e;font-size:14px;background:#fff">
            <span><input type="radio" name="ship" checked style="margin-right:10px">Standard (3–5 days)</span><span>Free</span>
          </label>
          <label style="display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;color:#6b6357;background:#fff">
            <span><input type="radio" name="ship" style="margin-right:10px">Express (1–2 days)</span><span>$12.00</span>
          </label>
        </div>
      </div>

      <div>
        <div style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#c1602f;font-weight:700;margin-bottom:12px">Payment</div>
        <input type="text" placeholder="Card number" style="width:100%;padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff;margin-bottom:14px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
          <input type="text" placeholder="Expiry (MM/YY)" style="padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
          <input type="text" placeholder="CVC" style="padding:15px 18px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
        </div>
      </div>
    </div>

    <div style="background:rgba(255,255,255,.7);backdrop-filter:blur(3px);border-radius:20px;padding:36px;position:sticky;top:24px;height:fit-content">
      <div style="font-size:18px;font-weight:700;margin-bottom:24px">Order Summary</div>
      <div style="display:flex;gap:14px;margin-bottom:16px">
        <div style="width:64px;height:64px;border-radius:10px;background:#a5d1e4;flex:none"></div>
        <div style="flex:1;font-size:13px">
          <div style="font-weight:700">Aurora Drops</div><div style="color:#6b6357">Qty 1</div>
        </div>
        <div style="font-size:13px;font-weight:700">$52.00</div>
      </div>
      <div style="display:flex;gap:14px;margin-bottom:20px">
        <div style="width:64px;height:64px;border-radius:10px;background:#f8ae7f;flex:none"></div>
        <div style="flex:1;font-size:13px">
          <div style="font-weight:700">Halo Glow Stick</div><div style="color:#6b6357">Qty 1</div>
        </div>
        <div style="font-size:13px;font-weight:700">$29.00</div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px;color:#5a5148;padding-top:16px;border-top:1px solid rgba(58,53,46,.15)">
        <span>Subtotal</span><span>$81.00</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:20px;color:#5a5148">
        <span>Shipping</span><span>Free</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding-top:18px;border-top:1px solid rgba(58,53,46,.15);margin-bottom:26px">
        <span>Total</span><span>$81.00</span>
      </div>
      <a class="au-link" href="#" style="display:block;text-align:center;background:#f8ae7f;color:#3a2317;padding:16px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:100px">Place Order</a>
    </div>

  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
