<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Manrope',sans-serif}
  a.au-link{text-decoration:none}
  a.au-link:hover{opacity:.7}
</style>
<script src="./image-slot.js"></script>
</helmet>

<div data-screen-label="Cart" style="background-color:#fff9f3;background-repeat:repeat-y;background-size:100% 950px;background-image:
    radial-gradient(700px circle at 8% 8%, rgba(165,209,228,.45), transparent 60%),
    radial-gradient(650px circle at 92% 20%, rgba(191,181,232,.4), transparent 58%),
    radial-gradient(750px circle at 30% 65%, rgba(165,191,151,.4), transparent 60%);color:#3a352e;min-height:100vh">

  <!-- header -->
  <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 64px;border-bottom:1px solid rgba(58,53,46,.12)">
    <a href="Home.dc.html" style="display:flex;align-items:center"><img src="assets/aurealis-logo-black.webp" alt="Auréalis" style="height:64px;width:auto;display:block"></a>
    <div style="display:flex;gap:40px;font-size:13px;letter-spacing:.04em;text-transform:uppercase">
      <a class="au-link" href="Shop.dc.html" style="color:#3a352e">Skincare</a>
      <a class="au-link" href="Shop.dc.html" style="color:#3a352e">Makeup</a>
      <a class="au-link" href="About.dc.html" style="color:#3a352e">About</a>
      <a class="au-link" href="#" style="color:#3a352e">Journal</a>
    </div>
    <div style="display:flex;gap:22px;font-size:13px;letter-spacing:.03em">
      <a class="au-link" href="Login.dc.html" style="color:#3a352e">Login</a>
      <a class="au-link" href="Cart.dc.html" style="color:#3a352e;font-weight:700">Bag (2)</a>
    </div>
  </div>

  <div style="padding:56px 64px 100px;display:grid;grid-template-columns:1.6fr 1fr;gap:70px;align-items:flex-start">

    <div>
      <div style="font-family:'Cormorant Garamond',serif;font-size:42px;margin-bottom:36px">Your Bag</div>

      <div style="display:flex;gap:24px;padding:28px 0;border-top:1px solid rgba(58,53,46,.15)">
        <div style="width:120px;height:120px;border-radius:14px;overflow:hidden;background:#a5d1e4;flex:none"><image-slot id="cart-p1" shape="rect" placeholder="Product" style="width:100%;height:100%"></image-slot></div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <div style="font-size:16px;font-weight:700">Aurora Drops</div>
            <div style="font-size:16px;font-weight:700">$52.00</div>
          </div>
          <div style="font-size:13px;color:#6b6357;margin-bottom:16px">15ml</div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="display:flex;align-items:center;border:1px solid rgba(58,53,46,.3);border-radius:100px;overflow:hidden">
              <div style="padding:8px 14px;font-size:14px">−</div>
              <div style="padding:8px 4px;font-size:13px;min-width:16px;text-align:center">1</div>
              <div style="padding:8px 14px;font-size:14px">+</div>
            </div>
            <a class="au-link" href="#" style="font-size:13px;color:#8a8175;text-decoration:underline">Remove</a>
          </div>
        </div>
      </div>

      <div style="display:flex;gap:24px;padding:28px 0;border-top:1px solid rgba(58,53,46,.15)">
        <div style="width:120px;height:120px;border-radius:14px;overflow:hidden;background:#f8ae7f;flex:none"><image-slot id="cart-p2" shape="rect" placeholder="Product" style="width:100%;height:100%"></image-slot></div>
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px">
            <div style="font-size:16px;font-weight:700">Halo Glow Stick</div>
            <div style="font-size:16px;font-weight:700">$29.00</div>
          </div>
          <div style="font-size:13px;color:#6b6357;margin-bottom:16px">Shade: Aurora</div>
          <div style="display:flex;align-items:center;justify-content:space-between">
            <div style="display:flex;align-items:center;border:1px solid rgba(58,53,46,.3);border-radius:100px;overflow:hidden">
              <div style="padding:8px 14px;font-size:14px">−</div>
              <div style="padding:8px 4px;font-size:13px;min-width:16px;text-align:center">1</div>
              <div style="padding:8px 14px;font-size:14px">+</div>
            </div>
            <a class="au-link" href="#" style="font-size:13px;color:#8a8175;text-decoration:underline">Remove</a>
          </div>
        </div>
      </div>
      <div style="border-top:1px solid rgba(58,53,46,.15)"></div>

      <a class="au-link" href="Shop.dc.html" style="display:inline-block;margin-top:28px;font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:#c1602f;font-weight:700">← Continue Shopping</a>
    </div>

    <div style="background:rgba(255,255,255,.65);backdrop-filter:blur(3px);border-radius:20px;padding:36px;position:sticky;top:24px">
      <div style="font-size:18px;font-weight:700;margin-bottom:24px">Order Summary</div>
      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px;color:#5a5148">
        <span>Subtotal</span><span>$81.00</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:14px;margin-bottom:12px;color:#5a5148">
        <span>Shipping</span><span>Free</span>
      </div>
      <div style="display:flex;gap:10px;margin:20px 0">
        <input type="text" placeholder="Promo code" style="flex:1;padding:12px 14px;border-radius:100px;border:1px solid rgba(58,53,46,.3);font-size:13px;font-family:'Manrope',sans-serif;background:#fff9f3">
        <a class="au-link" href="#" style="padding:12px 20px;border-radius:100px;border:1px solid #3a352e;font-size:13px;color:#3a352e">Apply</a>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:18px;font-weight:700;padding-top:18px;border-top:1px solid rgba(58,53,46,.15);margin-bottom:26px">
        <span>Total</span><span>$81.00</span>
      </div>
      <a class="au-link" href="Checkout.dc.html" style="display:block;text-align:center;background:#f8ae7f;color:#3a2317;padding:16px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:100px">Checkout</a>
    </div>

  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
