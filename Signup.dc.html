<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  body{margin:0;font-family:'Manrope',sans-serif}
  a.au-link{text-decoration:none}
  a.au-link:hover{opacity:.7}
  input{box-sizing:border-box}
</style>
</helmet>

<div data-screen-label="Sign Up" style="background-color:#fff9f3;background-repeat:repeat-y;background-size:100% 950px;background-image:
    radial-gradient(700px circle at 12% 10%, rgba(165,209,228,.6), transparent 60%),
    radial-gradient(650px circle at 88% 22%, rgba(191,181,232,.55), transparent 58%),
    radial-gradient(750px circle at 30% 70%, rgba(165,191,151,.5), transparent 60%),
    radial-gradient(700px circle at 90% 90%, rgba(247,213,149,.55), transparent 58%);color:#3a352e;min-height:100vh;display:flex;flex-direction:column">

  <div style="padding:32px 64px">
    <a href="Home.dc.html" style="display:flex;align-items:center;width:fit-content"><img src="assets/aurealis-logo-black.webp" alt="Auréalis" style="height:56px;width:auto;display:block"></a>
  </div>

  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px 24px 80px">
    <div style="width:440px;max-width:100%;background:rgba(255,255,255,.7);backdrop-filter:blur(3px);border-radius:20px;padding:44px">
      <div style="font-family:'Cormorant Garamond',serif;font-size:32px;margin-bottom:8px;text-align:center">Create your account</div>
      <div style="font-size:14px;color:#6b6357;text-align:center;margin-bottom:32px">Join Aurealis for early access &amp; rewards</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
        <div>
          <div style="font-size:12px;font-weight:700;margin-bottom:8px">First name</div>
          <input type="text" placeholder="Jane" style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
        </div>
        <div>
          <div style="font-size:12px;font-weight:700;margin-bottom:8px">Last name</div>
          <input type="text" placeholder="Doe" style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
        </div>
      </div>
      <div style="margin-bottom:16px">
        <div style="font-size:12px;font-weight:700;margin-bottom:8px">Email</div>
        <input type="email" placeholder="you@email.com" style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
      </div>
      <div style="margin-bottom:20px">
        <div style="font-size:12px;font-weight:700;margin-bottom:8px">Password</div>
        <input type="password" placeholder="••••••••" style="width:100%;padding:14px 16px;border-radius:10px;border:1px solid rgba(58,53,46,.25);font-size:14px;font-family:'Manrope',sans-serif;background:#fff">
      </div>

      <label style="display:flex;align-items:flex-start;gap:8px;font-size:12px;color:#6b6357;margin-bottom:24px">
        <input type="checkbox" style="margin-top:2px">
        <span>I agree to the Terms of Service and Privacy Policy</span>
      </label>

      <a class="au-link" href="Home.dc.html" style="display:block;text-align:center;background:#f8ae7f;color:#3a2317;padding:15px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;border-radius:100px;margin-bottom:24px">Create Account</a>

      <div style="text-align:center;font-size:13px;color:#6b6357">Already have an account? <a class="au-link" href="Login.dc.html" style="color:#c1602f;font-weight:700">Sign in</a></div>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}"></script>
</body>
</html>
